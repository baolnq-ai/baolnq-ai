<svg width="820" height="170" viewBox="0 0 820 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="820" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/><stop offset="0.52" stop-color="#17134A"/><stop offset="1" stop-color="#24113A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#F0ABFC"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="820" height="170" rx="16" fill="url(#bg)" stroke="#334155"/>
  <circle cx="770" cy="22" r="5" fill="#67E8F9" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="790" cy="42" r="3" fill="#F0ABFC" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="30" y="35" fill="#67E8F9" font-size="13" font-weight="700">// CURRENT SIGNAL</text>
    <text x="30" y="78" fill="#F8FAFC" font-size="29" font-weight="800">AI · RAG · AGENTS</text>
    <text x="30" y="105" fill="#CBD5E1" font-size="13">14 public repositories · production-minded experiments</text>
    <text x="505" y="47" fill="#CBD5E1" font-size="12">FOCUS</text>
    <rect x="505" y="58" width="260" height="10" rx="5" fill="#1E293B"/>
    <rect x="505" y="58" width="218" height="10" rx="5" fill="url(#cyan)"><animate attributeName="width" values="180;218;180" dur="4s" repeatCount="indefinite"/></rect>
    <text x="505" y="94" fill="#CBD5E1" font-size="12">BUILDING</text>
    <rect x="505" y="105" width="260" height="10" rx="5" fill="#1E293B"/>
    <rect x="505" y="105" width="190" height="10" rx="5" fill="url(#pink)"><animate attributeName="width" values="150;190;150" dur="3.5s" repeatCount="indefinite"/></rect>
    <text x="505" y="141" fill="#64748B" font-size="11">pipeline → retrieval → useful answers</text>
  </g>
</svg>
